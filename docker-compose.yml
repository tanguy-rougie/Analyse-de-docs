# Orchestrateur local (pédagogique) : un conteneur par rôle.
# api et worker partagent la même image ; seule la commande de démarrage change.
services:
  api:
    build: .
    image: analyse-de-docs-app:local
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      CHROMA_PERSIST_DIR: /app/chroma_db
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "8000"
      RAG_COLLECTION: technical_docs
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2
      OLLAMA_HTTP_TIMEOUT: "600"
      DATABASE_URL: postgresql+psycopg://analyse:analyse@postgres:5432/analyse
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./Documents:/app/Documents
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build: .
    image: analyse-de-docs-app:local
    command: ["python", "-m", "src.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      CHROMA_PERSIST_DIR: /app/chroma_db
      DATABASE_URL: postgresql+psycopg://analyse:analyse@postgres:5432/analyse
      WORKER_POLL_INTERVAL: "2"
      WORKER_SIMULATED_DURATION: "3"
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./Documents:/app/Documents
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: analyse
      POSTGRES_PASSWORD: analyse
      POSTGRES_DB: analyse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyse -d analyse"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  hf_cache:
  ollama_data:
  postgres_data:
